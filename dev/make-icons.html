<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Make icons</title>
    <style>
      body { margin: 0; padding: 24px; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
      .row { display: flex; align-items: end; gap: 24px; padding: 16px; border-radius: 10px; }
      .light { background: #f1f3f4; }
      .dark { background: #202124; margin-top: 8px; }
      figure { margin: 0; text-align: center; color: #888; }
      .big img { width: 128px; height: 128px; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <p>
      Renders icons/16, 32, 48 and 128 from <code>drawAppIcon</code> in src/badge.js.
      <code>window.icons</code> holds each size as a base64 PNG; click a size to download it.
    </p>
    <div class="row light" id="light"></div>
    <div class="row dark" id="dark"></div>
    <div class="row light big" id="big"></div>

    <script type="module">
      import { drawAppIcon } from '../src/badge.js';

      window.icons = {};
      for (const size of [16, 32, 48, 128]) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        drawAppIcon(canvas.getContext('2d'), size);
        const url = canvas.toDataURL('image/png');
        window.icons[size] = url.split(',')[1];

        for (const id of ['light', 'dark', 'big']) {
          const figure = document.createElement('figure');
          figure.innerHTML = `<a download="${size}.png" href="${url}"><img src="${url}" width="${size}" height="${size}"></a><figcaption>${size}</figcaption>`;
          document.getElementById(id).append(figure);
        }
      }
    </script>
  </body>
</html>
